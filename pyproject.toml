[tool.poetry]
name = "nexusml"
version = "1.0.0"
description = "A comprehensive Machine Learning System and MLOps framework in Python"
authors = ["ramijashaik001-byte <ramijashaik001@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^1.20.0"
fastapi = "^0.100.0"
